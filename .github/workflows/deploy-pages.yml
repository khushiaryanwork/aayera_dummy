# Builds the site and publishes it to GitHub Pages:
#   https://khushiaryanwork.github.io/aayera_dummy/          (site)
#   https://khushiaryanwork.github.io/aayera_dummy/studio/   (Sanity Studio)
#
# Runs on every push to main, from the Actions tab ("Run workflow"),
# and when Sanity sends a "sanity-publish" repository_dispatch event.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE: https://khushiaryanwork.github.io
          BASE_PATH: /aayera_dummy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
